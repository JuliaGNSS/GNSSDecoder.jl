[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
GNSSDecoder = "bf6b1ec8-12ad-4501-972c-3dec0d675c2b"
# GNSSSignals is a direct dependency of the docs environment, not just an
# indirect one through GNSSDecoder: the "Signal Metadata" doctests call its
# accessors (which GNSSDecoder extends for a decoder state but does not
# re-export), and a doctest can only `using` a package the active project
# declares.
GNSSSignals = "52c80523-2a4e-5c38-8979-05588f836870"

[compat]
Documenter = "1"
GNSSSignals = "4"
